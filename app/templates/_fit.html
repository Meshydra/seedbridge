{# Circular fit score. Needs `score`. #}
<div class="fit" data-ring="{{ score }}">
  <svg viewBox="0 0 80 80" aria-hidden="true">
    <circle cx="40" cy="40" r="33" fill="none" stroke="#e5e4de" stroke-width="5"/>
    <circle cx="40" cy="40" r="33" fill="none" stroke="{{ '#0f6b4f' if score >= 60 else ('#b7862f' if score >= 35 else '#a9aaa2') }}" stroke-width="5"
      stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="{{ 100 - score }}" data-ring-arc/>
  </svg>
  <b><span data-count="{{ score }}">{{ score }}</span><small>%</small></b>
</div>
